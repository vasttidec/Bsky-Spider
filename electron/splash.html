<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Bsky-Spider</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #12233a;
        background:
          radial-gradient(340px 240px at 50% 35%, rgba(17, 133, 254, 0.12), transparent 70%),
          linear-gradient(155deg, #fbfdff 0%, #eef8ff 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-app-region: drag;
      }
      .card { text-align: center; }
      .logo {
        width: 82px;
        height: 82px;
        border-radius: 22px;
        box-shadow: 0 18px 34px -18px rgba(5, 70, 150, 0.55);
        animation: float 4s ease-in-out infinite;
      }
      h1 {
        margin: 18px 0 4px;
        font-size: 25px;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      .tagline {
        margin: 0;
        color: #7b95ad;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        padding: 7px 13px;
        border: 1px solid #dbeaf9;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: #6787a4;
        font-size: 11px;
      }
      .progress {
        position: relative;
        width: 268px;
        height: 6px;
        margin: 18px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(17, 133, 254, 0.12);
        box-shadow: inset 0 1px 2px rgba(6, 74, 150, 0.08);
      }
      .progress-fill {
        position: relative;
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1185fe 0%, #46b4ff 55%, #7fd3ff 100%);
        box-shadow: 0 0 10px rgba(17, 133, 254, 0.45);
        transition: width 0.35s cubic-bezier(0.22, 0.9, 0.3, 1);
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          100deg,
          transparent 20%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 80%
        );
        transform: translateX(-100%);
        animation: shimmer 1.4s ease-in-out infinite;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        width: 268px;
        margin: 7px auto 0;
        color: #9db4c8;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid #c9e5ff;
        border-top-color: #1185fe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .hint {
        margin-top: 12px;
        color: #a4b7c8;
        font-size: 9px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        60%, 100% { transform: translateX(100%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="./logo.png" alt="Bsky-Spider" />
      <h1>Bsky-Spider</h1>
      <p class="tagline">Bluesky media downloader</p>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="status-text">正在启动本地服务…</span>
        <span id="progress-value">0%</span>
      </div>
      <div class="status">
        <span class="spinner"></span>
        首次启动可能需要几秒钟
      </div>
    </main>
    <script>
      window.setProgress = function (percent, text) {
        var clamped = Math.max(0, Math.min(100, Number(percent) || 0));
        var fill = document.getElementById('progress-fill');
        var value = document.getElementById('progress-value');
        var status = document.getElementById('status-text');
        var bar = document.getElementById('progress');
        if (fill) fill.style.width = clamped + '%';
        if (value) value.textContent = Math.round(clamped) + '%';
        if (status && text) status.textContent = text;
        if (bar) bar.setAttribute('aria-valuenow', String(Math.round(clamped)));
      };
    </script>
  </body>
</html>
