<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Bsky-Spider</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #12233a;
        background:
          radial-gradient(340px 240px at 50% 35%, rgba(17, 133, 254, 0.12), transparent 70%),
          linear-gradient(155deg, #fbfdff 0%, #eef8ff 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-app-region: drag;
      }
      .card { text-align: center; }
      .logo {
        width: 82px;
        height: 82px;
        border-radius: 22px;
        box-shadow: 0 18px 34px -18px rgba(5, 70, 150, 0.55);
        animation: float 4s ease-in-out infinite;
      }
      h1 {
        margin: 18px 0 4px;
        font-size: 25px;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      .tagline {
        margin: 0;
        color: #7b95ad;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 27px;
        padding: 7px 13px;
        border: 1px solid #dbeaf9;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: #6787a4;
        font-size: 11px;
      }
      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid #c9e5ff;
        border-top-color: #1185fe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .hint {
        margin-top: 14px;
        color: #a4b7c8;
        font-size: 9px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="./logo.png" alt="Bsky-Spider" />
      <h1>Bsky-Spider</h1>
      <p class="tagline">Bluesky media studio</p>
      <div class="status">
        <span class="spinner"></span>
        正在启动本地服务…
      </div>
      <p class="hint">首次启动可能需要几秒钟</p>
    </main>
  </body>
</html>
